name: Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v$(jq -r .version version.json)"
          NAME=$(jq -r .name version.json)
          NOTES=$(jq -r .notes version.json)
          APK_FILE="Tenet-${VERSION}.apk"

          echo "Publishing release $VERSION with asset $APK_FILE..."

          if [ ! -f "$APK_FILE" ]; then
            echo "Error: $APK_FILE not found!"
            exit 1
          fi

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION exists, updating..."
            gh release upload "$VERSION" "$APK_FILE" --clobber
            gh release edit "$VERSION" --title "$NAME" --notes "$NOTES"
          else
            echo "Creating new release $VERSION..."
            gh release create "$VERSION" "$APK_FILE" \
              --title "$NAME" \
              --notes "$NOTES"
          fi
